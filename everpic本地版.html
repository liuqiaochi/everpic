<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EverPic Generator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;display:flex;justify-content:center;padding:40px 16px}
.container{max-width:560px;width:100%;position:relative}
h1{text-align:center;margin-bottom:24px;font-size:22px;color:#a78bfa}
label{display:block;margin-bottom:5px;font-size:13px;color:#aaa}
select,textarea,input[type="number"],input[type="text"]{width:100%;padding:9px 11px;border:1px solid #333;border-radius:8px;background:#16213e;color:#e0e0e0;font-size:13px;outline:none;transition:border-color .2s}
select:focus,textarea:focus,input:focus{border-color:#a78bfa}
textarea{resize:vertical;min-height:70px;font-family:inherit}
.field{margin-bottom:16px}
.row{display:flex;gap:10px}
.row .field{flex:1}
.section-title{font-size:14px;color:#a78bfa;margin:20px 0 10px;padding-bottom:5px;border-bottom:1px solid #333}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;background:#7c3aed;color:#fff;transition:background .2s,opacity .2s}
.btn:hover:not(:disabled){background:#6d28d9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hint{font-size:11px;color:#666;margin-top:2px}
.job-count{text-align:center;font-size:12px;color:#888;margin-top:8px}

/* 历史面板 - 右侧滑出覆盖半屏 */
.history-toggle{position:fixed;right:0;top:50%;transform:translateY(-50%);background:#7c3aed;color:#fff;border:none;padding:12px 6px;border-radius:8px 0 0 8px;cursor:pointer;font-size:13px;writing-mode:vertical-rl;letter-spacing:2px;z-index:50;transition:background .2s}
.history-toggle:hover{background:#6d28d9}
.history-toggle .badge{display:inline-block;background:#ef4444;color:#fff;border-radius:50%;width:18px;height:18px;line-height:18px;text-align:center;font-size:10px;writing-mode:horizontal-tb;margin-top:6px}
.history-panel{position:fixed;top:0;right:-50vw;width:50vw;height:100vh;background:#111827;border-left:1px solid #333;z-index:60;transition:right .3s ease;display:flex;flex-direction:column}
.history-panel.open{right:0}
.panel-header{padding:16px 20px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}
.panel-header h3{font-size:16px;color:#a78bfa}
.panel-header-btns{display:flex;gap:8px}
.btn-sm{padding:6px 14px;font-size:12px;width:auto;border-radius:6px;border:none;cursor:pointer;color:#fff}
.btn-close{background:#374151}.btn-close:hover{background:#4b5563}
.btn-danger{background:#dc2626}.btn-danger:hover{background:#b91c1c}
.history-list{flex:1;overflow-y:auto;padding:12px}
.history-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;cursor:pointer;transition:background .15s;border-bottom:1px solid #222}
.history-item:hover{background:#1e293b}
.history-thumb{width:48px;height:48px;border-radius:6px;object-fit:cover;background:#1e293b;flex-shrink:0}
.history-info{flex:1;min-width:0}
.history-info .name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-info .time{font-size:11px;color:#666;margin-top:2px}
.history-status{font-size:11px;padding:2px 8px;border-radius:10px;flex-shrink:0}
.status-done{background:#065f46;color:#6ee7b7}
.status-pending{background:#713f12;color:#fcd34d}
.status-fail{background:#7f1d1d;color:#fca5a5}
.empty-state{text-align:center;color:#555;padding:60px 20px;font-size:14px}

/* 大图预览 */
.preview-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;cursor:zoom-out}
.preview-overlay img{max-width:90vw;max-height:85vh;object-fit:contain;border-radius:8px}
.download-btn{padding:8px 24px;border-radius:8px;background:#059669;color:#fff;text-decoration:none;font-size:13px;font-weight:600}
.download-btn:hover{background:#047857}

/* 遮罩 */
.panel-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;display:none}
.panel-backdrop.show{display:block}
</style>
</head>
<body>
<div class="container">
  <h1>EverPic Generator</h1>
  <div class="field">
    <label for="charSelect">角色选择</label>
    <select id="charSelect"><option value="">-- 请选择角色 --</option></select>
  </div>
  <div class="field">
    <label for="variantSelect">变体 (Variant)</label>
    <select id="variantSelect"><option value="">请先选择角色</option></select>
  </div>
  <div class="field">
    <label for="promptInput">正向 Prompt（可选）</label>
    <textarea id="promptInput" placeholder="输入你想要的画面描述..."></textarea>
  </div>
  <div class="section-title">⚙️ 高级设置</div>
  <div class="row">
    <div class="field"><label>Model Strength</label><input type="number" id="modelStr" value="0.9" min="0" max="1" step="0.01"></div>
    <div class="field"><label>Clip Strength</label><input type="number" id="clipStr" value="1" min="0" max="1" step="0.01"></div>
  </div>
  <div class="row">
    <div class="field"><label>Steps</label><input type="number" id="stepsInput" value="27" min="1" max="50" step="1"></div>
    <div class="field"><label>CFG Scale</label><input type="number" id="cfgInput" value="6" min="1" max="20" step="0.1"></div>
  </div>
  <div class="field">
    <label>Negative Prompt（可选）</label>
    <input type="text" id="negInput" placeholder="额外负面提示词">
    <div class="hint">默认: bad quality, worst quality, worst detail, sketch, censor</div>
  </div>
  <button class="btn" id="generateBtn" disabled>生成</button>
  <div class="job-count" id="jobCount"></div>
</div>

<!-- 右侧历史按钮 -->
<button class="history-toggle" id="historyToggle" onclick="togglePanel()">
  历史<span class="badge" id="historyBadge" style="display:none">0</span>
</button>

<!-- 遮罩 -->
<div class="panel-backdrop" id="panelBackdrop" onclick="togglePanel()"></div>

<!-- 历史面板 -->
<div class="history-panel" id="historyPanel">
  <div class="panel-header">
    <h3>📋 历史记录 (<span id="historyCount">0</span>/100)</h3>
    <div class="panel-header-btns">
      <button class="btn-sm btn-danger" onclick="if(confirm('确定清空？')){clearHistory()}">清空</button>
      <button class="btn-sm btn-close" onclick="togglePanel()">关闭</button>
    </div>
  </div>
  <div class="history-list" id="historyList">
    <div class="empty-state">暂无生成记录</div>
  </div>
</div>

<!-- 大图预览 -->
<div class="preview-overlay" id="previewOverlay" style="display:none" onclick="closePreview(event)">
  <img id="previewImg" src="" alt="Preview">
  <a class="download-btn" id="previewDownload" href="" download="everpic.png">下载原图</a>
</div>

let selectedChar=null,selectedVariant=null,activeJobs=0,panelOpen=false;

const $=id=>document.getElementById(id);

// --- Panel ---
function togglePanel(){
  panelOpen=!panelOpen;
  $('historyPanel').classList.toggle('open',panelOpen);
  $('panelBackdrop').classList.toggle('show',panelOpen);
}
function closePreview(e){if(e.target.tagName!=='A')$('previewOverlay').style.display='none'}
function showPreview(url){$('previewImg').src=url;$('previewDownload').href=url;$('previewOverlay').style.display='flex'}

// --- History ---
function loadHistory(){try{return JSON.parse(localStorage.getItem('everpic_history')||'[]')}catch{return[]}}
function saveHistory(h){h=h.slice(-MAX_HISTORY);localStorage.setItem('everpic_history',JSON.stringify(h))}
function addHistory(item){const h=loadHistory();h.push(item);saveHistory(h);renderHistory()}
function updateHistory(id,updates){const h=loadHistory();const i=h.findIndex(x=>x.id===id);if(i>=0){Object.assign(h[i],updates);saveHistory(h);renderHistory()}}
function clearHistory(){localStorage.removeItem('everpic_history');renderHistory()}

function renderHistory(){
  const h=loadHistory();
  $('historyCount').textContent=h.length;
  const pending=h.filter(x=>x.status==='pending').length;
  const badge=$('historyBadge');
  if(pending>0){badge.textContent=pending;badge.style.display=''}else{badge.style.display='none'}
  if(!h.length){$('historyList').innerHTML='<div class="empty-state">暂无生成记录</div>';return}
  $('historyList').innerHTML='';
  for(let i=h.length-1;i>=0;i--){
    const item=h[i];
    const div=document.createElement('div');
    div.className='history-item';
    const sc=item.status==='done'?'status-done':item.status==='fail'?'status-fail':'status-pending';
    const st=item.status==='done'?'完成':item.status==='fail'?'失败':'生成中';
    const thumb=item.imageUrl?'<img class="history-thumb" src="'+item.imageUrl+'" alt="">':'<div class="history-thumb"></div>';
    div.innerHTML=thumb+'<div class="history-info"><div class="name">'+item.charName+' - '+item.variantName+'</div><div class="time">'+item.time+'</div></div><span class="history-status '+sc+'">'+st+'</span>';
    if(item.status==='done'&&item.imageUrl){div.onclick=(()=>{const u=item.imageUrl;return()=>showPreview(u)})();div.title='点击查看大图'}
    $('historyList').appendChild(div);
  }
}

// --- Selects ---
loraData.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=c.name_cn+' / '+c.name;$('charSelect').appendChild(o)});
$('charSelect').addEventListener('change',()=>{
  const idx=$('charSelect').value;$('variantSelect').innerHTML='';
  if(idx===''){selectedChar=null;selectedVariant=null;$('variantSelect').innerHTML='<option value="">请先选择角色</option>';$('generateBtn').disabled=true;return}
  selectedChar=loraData[idx];
  selectedChar.variants.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(v.name_cn||v.name)+' ('+v.keyword+')';$('variantSelect').appendChild(o)});
  selectedVariant=selectedChar.variants[0];$('generateBtn').disabled=false;
});
$('variantSelect').addEventListener('change',()=>{if(selectedChar)selectedVariant=selectedChar.variants[$('variantSelect').value]});
$('generateBtn').addEventListener('click',generate);

function updateJobCount(){$('jobCount').textContent=activeJobs>0?'当前任务: '+activeJobs+'/'+MAX_JOBS:''}

async function generate(){
  if(!selectedVariant||activeJobs>=MAX_JOBS)return;
  const ms=parseFloat($('modelStr').value)||0.9,cs=parseFloat($('clipStr').value)||1;
  const steps=parseInt($('stepsInput').value)||27,cfg=parseFloat($('cfgInput').value)||6;
  const userNeg=$('negInput').value.trim();
  const primary={ckpt:selectedVariant.ckpt,keyword:selectedVariant.keyword,name:selectedVariant.name,parent:selectedChar.name};
  const up=$('promptInput').value.trim();
  const positive=primary.keyword+', '+up+(up?', ':'')+'masterpiece, best quality, amazing quality';
  let negative='bad quality,worst quality,worst detail,sketch,censor,';if(userNeg)negative+=userNeg;
  const body={primary,positive,negative,primary_model:ms,primary_clip:cs,extra_model:ms,extra_clip:cs,three_model:ms,three_clip:cs,steps,cfgScale:cfg,size:'portrait',image_strength:1,count:1};

  const hid=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  addHistory({id:hid,charName:selectedChar.name_cn,variantName:selectedVariant.name_cn||selectedVariant.name,time:new Date().toLocaleString(),status:'pending',imageUrl:null});

  activeJobs++;updateJobCount();if(activeJobs>=MAX_JOBS)$('generateBtn').disabled=true;
  try{
    const res=await fetch(API+'generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(res.status===403){const e=await res.json();throw new Error(e.message||'403')}
    if(res.status===429)throw new Error('请求过于频繁');
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();const jobId=data.id||data;
    const imageUrl=await pollStatus(jobId);
    updateHistory(hid,{status:'done',imageUrl});
  }catch(e){updateHistory(hid,{status:'fail'})}
  finally{activeJobs--;updateJobCount();if(selectedVariant)$('generateBtn').disabled=false}
}

function pollStatus(jid){
  return new Promise((ok,fail)=>{
    const iv=setInterval(async()=>{try{
      const r=await fetch(API+'status/'+jid);
      if(!r.ok){if(r.status===404){clearInterval(iv);fail(new Error('过期'))}return}
      const d=await r.json();
      if(d.status==='COMPLETED'){clearInterval(iv);ok(API+'fetch/'+jid)}
      else if(d.status==='FAILED'){clearInterval(iv);fail(new Error('失败'))}
    }catch{}},2000);
    setTimeout(()=>{clearInterval(iv);fail(new Error('超时'))},300000);
  });
}

renderHistory();
